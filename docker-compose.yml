x-default-env-file: &default-env-file
  env_file:
    - .env

services:
  postgres_nsi:
    image: postgres:16-alpine
    container_name: insider_market_backend_nsi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_NSI:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_NSI:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_NSI:-football_db}
    ports:
      - "${POSTGRES_PORT_NSI:-5432}:5432"
    volumes:
      - postgres_nsi_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_NSI:-postgres} -d ${POSTGRES_DB_NSI:-football_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_auth:
    image: postgres:16-alpine
    container_name: insider_market_backend_auth_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_AUTH:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-auth_db}
    ports:
      - "${POSTGRES_PORT_AUTH:-5433}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_AUTH:-postgres} -d ${POSTGRES_DB_AUTH:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_admin:
    image: postgres:16-alpine
    container_name: insider_market_backend_admin_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_ADMIN:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ADMIN:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_ADMIN:-admin_db}
    ports:
      - "${POSTGRES_PORT_ADMIN:-5439}:5432"
    volumes:
      - postgres_admin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_ADMIN:-postgres} -d ${POSTGRES_DB_ADMIN:-admin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_rumor:
    image: postgres:16-alpine
    container_name: insider_market_backend_rumor_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_RUMOR:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RUMOR:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_RUMOR:-rumor_db}
    ports:
      - "${POSTGRES_PORT_RUMOR:-5434}:5432"
    volumes:
      - postgres_rumor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_RUMOR:-postgres} -d ${POSTGRES_DB_RUMOR:-rumor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_event:
    image: postgres:16-alpine
    container_name: insider_market_backend_event_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_EVENT:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_EVENT:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_EVENT:-event_db}
    ports:
      - "${POSTGRES_PORT_EVENT:-5435}:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_EVENT:-postgres} -d ${POSTGRES_DB_EVENT:-event_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_market:
    image: postgres:16-alpine
    container_name: insider_market_backend_market_db
