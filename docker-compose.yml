        condition: service_healthy
    networks:
      - football_network
    command: >
      sh -c "alembic -c migrations/profile_service/alembic.ini upgrade head"

  migrations_rating:
    <<: *default-env-file
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: insider_market_backend_rating_migrations
    environment:
      DATABASE_URL_RATING: postgresql+asyncpg://${POSTGRES_USER_RATING:-postgres}:${POSTGRES_PASSWORD_RATING:-postgres}@postgres_rating:5432/${POSTGRES_DB_RATING:-rating_db}
    depends_on:
      postgres_rating:
        condition: service_healthy
    networks:
      - football_network
    command: >
      sh -c "alembic -c migrations/rating_service/alembic.ini upgrade head"

  nsi_service:
    <<: *default-env-file
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: insider_market_backend_nsi_service
    environment:
      DATABASE_URL_NSI: postgresql+asyncpg://${POSTGRES_USER_NSI:-postgres}:${POSTGRES_PASSWORD_NSI:-postgres}@postgres_nsi:5432/${POSTGRES_DB_NSI:-football_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL: ${JWT_TTL:-3600}
      DEBUG: "false"
      ENVIRONMENT: production
      APP_NAME: "${APP_NAME:-Football Research Insider Market}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
      - "8001"
    depends_on:
      postgres_nsi:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_nsi:
        condition: service_completed_successfully
    networks:
      - football_network
    command: >
      python -m uvicorn src.nsi_service.main:app --host 0.0.0.0 --port 8001 --workers ${WORKERS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  auth_service:
