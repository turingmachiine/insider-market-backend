      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_profile:
    image: postgres:16-alpine
    container_name: insider_market_backend_profile_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_PROFILE:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROFILE:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_PROFILE:-profile_db}
    ports:
      - "${POSTGRES_PORT_PROFILE:-5437}:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_PROFILE:-postgres} -d ${POSTGRES_DB_PROFILE:-profile_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_rating:
    image: postgres:16-alpine
    container_name: insider_market_backend_rating_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_RATING:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RATING:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_RATING:-rating_db}
    ports:
      - "${POSTGRES_PORT_RATING:-5438}:5432"
    volumes:
      - postgres_rating_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_RATING:-postgres} -d ${POSTGRES_DB_RATING:-rating_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: insider_market_backend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: insider_market_backend_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - football_network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: insider_market_backend_kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - football_network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: insider_market_backend_logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - football_network
    restart: unless-stopped

  migrations_nsi:
    <<: *default-env-file
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: insider_market_backend_nsi_migrations
    environment:
      DATABASE_URL_NSI: postgresql+asyncpg://${POSTGRES_USER_NSI:-postgres}:${POSTGRES_PASSWORD_NSI:-postgres}@postgres_nsi:5432/${POSTGRES_DB_NSI:-football_db}
    depends_on:
      postgres_nsi:
        condition: service_healthy
    networks:
      - football_network
    command: >
      sh -c "alembic -c migrations/nsi_service/alembic.ini upgrade head"

  migrations_auth:
    <<: *default-env-file
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: insider_market_backend_auth_migrations
    environment:
      DATABASE_URL_AUTH: postgresql+asyncpg://${POSTGRES_USER_AUTH:-postgres}:${POSTGRES_PASSWORD_AUTH:-postgres}@postgres_auth:5432/${POSTGRES_DB_AUTH:-auth_db}
