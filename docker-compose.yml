    container_name: insider_market_backend_profile_service
    environment:
      DATABASE_URL_PROFILE: postgresql+asyncpg://${POSTGRES_USER_PROFILE:-postgres}:${POSTGRES_PASSWORD_PROFILE:-postgres}@postgres_profile:5432/${POSTGRES_DB_PROFILE:-profile_db}
