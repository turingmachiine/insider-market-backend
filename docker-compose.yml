      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service}
      SERVICE_JWT_ALGORITHM: ${SERVICE_JWT_ALGORITHM:-HS256}
      DEBUG: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
