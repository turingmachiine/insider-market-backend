# Docker Compose для локальной разработки
# Используется для разработки с hot-reload и отладки

services:
  # NSI PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: football_research_db_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_NSI:-football_db}
    ports:
      - "${POSTGRES_PORT_NSI:-5432}:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_NSI:-football_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - football_network_local

  # Auth PostgreSQL Database
  postgres_auth:
    image: postgres:16-alpine
    container_name: football_research_auth_db_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER_AUTH:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-auth_db}
    ports:
      - "${POSTGRES_PORT_AUTH:-5433}:5432"
    volumes:
      - postgres_auth_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_AUTH:-postgres} -d ${POSTGRES_DB_AUTH:-auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - football_network_local

  # Rumor PostgreSQL Database
  postgres_rumor:
    image: postgres:16-alpine
    container_name: football_research_rumor_db_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER_RUMOR:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RUMOR:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_RUMOR:-rumor_db}
    ports:
      - "${POSTGRES_PORT_RUMOR:-5434}:5432"
    volumes:
      - postgres_rumor_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_RUMOR:-postgres} -d ${POSTGRES_DB_RUMOR:-rumor_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - football_network_local

  # Event PostgreSQL Database
  postgres_event:
    image: postgres:16-alpine
    container_name: football_research_event_db_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER_EVENT:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_EVENT:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_EVENT:-event_db}
    ports:
      - "${POSTGRES_PORT_EVENT:-5435}:5432"
    volumes:
      - postgres_event_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_EVENT:-postgres} -d ${POSTGRES_DB_EVENT:-event_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - football_network_local

  # Market PostgreSQL Database
  postgres_market:
    image: postgres:16-alpine
    container_name: football_research_market_db_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER_MARKET:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_MARKET:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_MARKET:-market_db}
    ports:
      - "${POSTGRES_PORT_MARKET:-5436}:5432"
    volumes:
      - postgres_market_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_MARKET:-postgres} -d ${POSTGRES_DB_MARKET:-market_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - football_network_local

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: football_research_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - football_network_local

  # Elasticsearch для локального сбора логов
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: football_research_elasticsearch_local
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data_local:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - football_network_local

  # Kibana для локального просмотра логов
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: football_research_kibana_local
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - football_network_local

  # Logstash читает JSON-логи из Redis и пишет их в Elasticsearch
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: football_research_logstash_local
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - football_network_local

  # NSI Database Migrations
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_migrations_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB_NSI:-football_db}
      DATABASE_URL_NSI: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB_NSI:-football_db}
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - football_network_local
    volumes:
      # Монтируем код для hot-reload, но исключаем .venv
      - .:/app:cached
      - /app/.venv
    command: >
      python -m alembic -c migrations/nsi_service/alembic.ini upgrade head

  # Auth Database Migrations
  migrations_auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_auth_migrations_local
    environment:
      DATABASE_URL_AUTH: postgresql+asyncpg://${POSTGRES_USER_AUTH:-postgres}:${POSTGRES_PASSWORD_AUTH:-postgres}@postgres_auth:5432/${POSTGRES_DB_AUTH:-auth_db}
      DEBUG: "true"
    depends_on:
      postgres_auth:
        condition: service_healthy
    networks:
      - football_network_local
    volumes:
      - .:/app:cached
      - /app/.venv
    command: >
      python -m alembic -c migrations/auth_service/alembic.ini upgrade head

  # Rumor Database Migrations
  migrations_rumor:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_rumor_migrations_local
    environment:
      DATABASE_URL_RUMOR: postgresql+asyncpg://${POSTGRES_USER_RUMOR:-postgres}:${POSTGRES_PASSWORD_RUMOR:-postgres}@postgres_rumor:5432/${POSTGRES_DB_RUMOR:-rumor_db}
      DEBUG: "true"
    depends_on:
      postgres_rumor:
        condition: service_healthy
    networks:
      - football_network_local
    volumes:
      - .:/app:cached
      - /app/.venv
    command: >
      python -m alembic -c migrations/rumor_service/alembic.ini upgrade head

  # Event Database Migrations
  migrations_event:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_event_migrations_local
    environment:
      DATABASE_URL_EVENT: postgresql+asyncpg://${POSTGRES_USER_EVENT:-postgres}:${POSTGRES_PASSWORD_EVENT:-postgres}@postgres_event:5432/${POSTGRES_DB_EVENT:-event_db}
      DEBUG: "true"
    depends_on:
      postgres_event:
        condition: service_healthy
    networks:
      - football_network_local
    volumes:
      - .:/app:cached
      - /app/.venv
    command: >
      python -m alembic -c migrations/event_service/alembic.ini upgrade head

  # Market Database Migrations
  migrations_market:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_market_migrations_local
    environment:
      DATABASE_URL_MARKET: postgresql+asyncpg://${POSTGRES_USER_MARKET:-postgres}:${POSTGRES_PASSWORD_MARKET:-postgres}@postgres_market:5432/${POSTGRES_DB_MARKET:-market_db}
      DEBUG: "true"
    depends_on:
      postgres_market:
        condition: service_healthy
    networks:
      - football_network_local
    volumes:
      - .:/app:cached
      - /app/.venv
    command: >
      python -m alembic -c migrations/market_service/alembic.ini upgrade head

  # NSI Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_app_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB_NSI:-football_db}
      DATABASE_URL_NSI: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB_NSI:-football_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL: ${JWT_TTL:-3600}
      DEBUG: "true"
      ENVIRONMENT: development
      APP_NAME: "${APP_NAME:-Football Research Insider Market (Dev)}"
      APP_VERSION: "${APP_VERSION:-1.0.0-dev}"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
      WORKERS: "1"
    expose:
      - "8001"
    volumes:
      # Монтируем код для hot-reload, но исключаем .venv
      - .:/app:cached
      - /app/.venv
      - ./logs:/app/logs:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - football_network_local
    command: >
      python -m uvicorn src.backend.nsi_service.main:app --host 0.0.0.0 --port 8001 --reload --log-level debug
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Auth Service
  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_auth_service_local
    environment:
      DATABASE_URL_AUTH: postgresql+asyncpg://${POSTGRES_USER_AUTH:-postgres}:${POSTGRES_PASSWORD_AUTH:-postgres}@postgres_auth:5432/${POSTGRES_DB_AUTH:-auth_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL: ${JWT_TTL:-3600}
      DEBUG: "true"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
      - "8002"
    volumes:
      - .:/app:cached
      - /app/.venv
      - ./logs:/app/logs:rw
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_auth:
        condition: service_completed_successfully
    networks:
      - football_network_local
    command: >
      python -m uvicorn src.backend.auth_service.main:app --host 0.0.0.0 --port 8002 --reload --log-level debug
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Rumor Service
  rumor_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_rumor_service_local
    environment:
      DATABASE_URL_RUMOR: postgresql+asyncpg://${POSTGRES_USER_RUMOR:-postgres}:${POSTGRES_PASSWORD_RUMOR:-postgres}@postgres_rumor:5432/${POSTGRES_DB_RUMOR:-rumor_db}
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
      - "8003"
    volumes:
      - .:/app:cached
      - /app/.venv
      - ./logs:/app/logs:rw
    depends_on:
      postgres_rumor:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_rumor:
        condition: service_completed_successfully
    networks:
      - football_network_local
    command: >
      python -m uvicorn src.backend.rumor_service.main:app --host 0.0.0.0 --port 8003 --reload --log-level debug
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Event Service
  event_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_event_service_local
    environment:
      DATABASE_URL_EVENT: postgresql+asyncpg://${POSTGRES_USER_EVENT:-postgres}:${POSTGRES_PASSWORD_EVENT:-postgres}@postgres_event:5432/${POSTGRES_DB_EVENT:-event_db}
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
      - "8004"
    volumes:
      - .:/app:cached
      - /app/.venv
      - ./logs:/app/logs:rw
    depends_on:
      postgres_event:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_event:
        condition: service_completed_successfully
    networks:
      - football_network_local
    command: >
      python -m uvicorn src.backend.event_service.main:app --host 0.0.0.0 --port 8004 --reload --log-level debug
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Market Service
  market_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_market_service_local
    environment:
      DATABASE_URL_MARKET: postgresql+asyncpg://${POSTGRES_USER_MARKET:-postgres}:${POSTGRES_PASSWORD_MARKET:-postgres}@postgres_market:5432/${POSTGRES_DB_MARKET:-market_db}
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
      - "8005"
    volumes:
      - .:/app:cached
      - /app/.venv
      - ./logs:/app/logs:rw
    depends_on:
      postgres_market:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_market:
        condition: service_completed_successfully
    networks:
      - football_network_local
    command: >
      python -m uvicorn src.backend.market_service.main:app --host 0.0.0.0 --port 8005 --reload --log-level debug
    stdin_open: true
    tty: true
    restart: unless-stopped

  # API Gateway
  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_api_gateway_local
    environment:
      SERVICE_NSI_URL: ${SERVICE_NSI_URL:-http://app:8001}
      SERVICE_AUTH_URL: ${SERVICE_AUTH_URL:-http://auth_service:8002}
      SERVICE_RUMOR_URL: ${SERVICE_RUMOR_URL:-http://rumor_service:8003}
      SERVICE_EVENT_URL: ${SERVICE_EVENT_URL:-http://event_service:8004}
      SERVICE_MARKET_URL: ${SERVICE_MARKET_URL:-http://market_service:8005}
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT: ${RATE_LIMIT:-100/minute}
      RATE_LIMIT_BY_JWT: ${RATE_LIMIT_BY_JWT:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      MAX_BODY_SIZE_MB: ${MAX_BODY_SIZE_MB:-10}
      DEBUG: "true"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - .:/app:cached
      - /app/.venv
      - ./logs:/app/logs:rw
    depends_on:
      app:
        condition: service_started
      auth_service:
        condition: service_started
      rumor_service:
        condition: service_started
      event_service:
        condition: service_started
      market_service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - football_network_local
    command: >
      python -m uvicorn src.backend.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ETL worker and scheduler are opt-in for local development.
  etl_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_etl_worker_local
    environment:
      RUMOR_SERVICE_URL: ${RUMOR_SERVICE_URL:-http://rumor_service:8003}
      TASKIQ_REDIS_URL: ${TASKIQ_REDIS_URL:-redis://redis:6379/0}
      TASKIQ_QUEUE_NAME: ${TASKIQ_QUEUE_NAME:-football_research_etl}
      RAW_IMPORT_CRON: "${RAW_IMPORT_CRON:-*/30 * * * *}"
      RUMOR_NORMALIZATION_CRON: "${RUMOR_NORMALIZATION_CRON:-*/15 * * * *}"
      SOURCE_FETCH_LIMIT: ${SOURCE_FETCH_LIMIT:-20}
      RAW_PUBLICATIONS_LIMIT: ${RAW_PUBLICATIONS_LIMIT:-500}
      EXISTING_RUMORS_LIMIT: ${EXISTING_RUMORS_LIMIT:-500}
    volumes:
      - .:/app:cached
      - /app/.venv
    depends_on:
      rumor_service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - football_network_local
    command: >
      taskiq worker src.backend.etl_service.infrastructure.taskiq.broker:broker
    restart: unless-stopped

  etl_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: football_research_etl_scheduler_local
    environment:
      RUMOR_SERVICE_URL: ${RUMOR_SERVICE_URL:-http://rumor_service:8003}
      TASKIQ_REDIS_URL: ${TASKIQ_REDIS_URL:-redis://redis:6379/0}
      TASKIQ_QUEUE_NAME: ${TASKIQ_QUEUE_NAME:-football_research_etl}
      RAW_IMPORT_CRON: "${RAW_IMPORT_CRON:-*/30 * * * *}"
      RUMOR_NORMALIZATION_CRON: "${RUMOR_NORMALIZATION_CRON:-*/15 * * * *}"
      SOURCE_FETCH_LIMIT: ${SOURCE_FETCH_LIMIT:-20}
      RAW_PUBLICATIONS_LIMIT: ${RAW_PUBLICATIONS_LIMIT:-500}
      EXISTING_RUMORS_LIMIT: ${EXISTING_RUMORS_LIMIT:-500}
    volumes:
      - .:/app:cached
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - football_network_local
    command: >
      taskiq scheduler src.backend.etl_service.infrastructure.taskiq.scheduler:scheduler
    restart: unless-stopped

  # pgAdmin для управления базой данных (опционально)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: football_research_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - football_network_local
    profiles:
      - tools

  # Redis Commander для управления Redis (опционально)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: football_research_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - football_network_local
    profiles:
      - tools

volumes:
  postgres_data_local:
    driver: local
  postgres_auth_data_local:
    driver: local
  postgres_rumor_data_local:
    driver: local
  postgres_event_data_local:
    driver: local
  postgres_market_data_local:
    driver: local
  redis_data_local:
    driver: local
  elasticsearch_data_local:
    driver: local
  pgadmin_data:
    driver: local

networks:
  football_network_local:
    driver: bridge
