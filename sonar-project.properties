# SonarCloud configuration for Football Research Application
# https://sonarcloud.io

# Project identification
sonar.organization=your-organization
sonar.projectKey=insider_market_backend
sonar.projectName=Football Research Insider Market
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.python.version=3.12

# Source directories
sonar.sources=src

# Test directories
sonar.tests=tests

# Python test reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/__init__.py,**/tests/**,**/.venv/**,**/data/**,**/logs/**

# Test file exclusions from coverage
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py

# Duplication detection
sonar.python.file.suffixes=.py

# Issue severity adjustments
sonar.issue.ignore.multicriteria=e1,e2

# Ignore documentation requirements for internal modules
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/infrastructure/**

# Ignore cognitive complexity for simple DTO files
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/dto.py

# Quality gate conditions
# sonar.qualitygate.wait=true

# SCM provider
sonar.scm.provider=git
sonar.scm.forceReloadAll=false
