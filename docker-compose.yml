    depends_on:
      postgres_profile:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_profile:
        condition: service_completed_successfully
    networks:
      - football_network
    command: >
      python -m uvicorn src.profile_service.main:app --host 0.0.0.0 --port 8007 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
