services:
  postgres_nsi:
    image: postgres:16-alpine
    container_name: football_research_nsi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_NSI:-football_db}
    ports:
      - "${POSTGRES_PORT_NSI:-5432}:5432"
    volumes:
      - postgres_nsi_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_NSI:-football_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  postgres_auth:
    image: postgres:16-alpine
    container_name: football_research_auth_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER_AUTH:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-auth_db}
    ports:
      - "${POSTGRES_PORT_AUTH:-5433}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_AUTH:-postgres} -d ${POSTGRES_DB_AUTH:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: football_research_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - football_network
    restart: unless-stopped

  migrations_nsi:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: football_research_nsi_migrations
    environment:
      DATABASE_URL_NSI: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_nsi:5432/${POSTGRES_DB_NSI:-football_db}
    depends_on:
      postgres_nsi:
        condition: service_healthy
    networks:
      - football_network
    command: >
      sh -c "alembic -c migrations/nsi_service/alembic.ini upgrade head"

  migrations_auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: football_research_auth_migrations
    environment:
      DATABASE_URL_AUTH: postgresql+asyncpg://${POSTGRES_USER_AUTH:-postgres}:${POSTGRES_PASSWORD_AUTH:-postgres}@postgres_auth:5432/${POSTGRES_DB_AUTH:-auth_db}
    depends_on:
      postgres_auth:
        condition: service_healthy
    networks:
      - football_network
    command: >
      sh -c "alembic -c migrations/auth_service/alembic.ini upgrade head"

  nsi_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: football_research_nsi_service
    environment:
      DATABASE_URL_NSI: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_nsi:5432/${POSTGRES_DB_NSI:-football_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL: ${JWT_TTL:-3600}
      DEBUG: "false"
      ENVIRONMENT: production
      APP_NAME: "${APP_NAME:-Football Research API}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JSON_LOGS: "${JSON_LOGS:-true}"
    expose:
      - "8001"
    depends_on:
      postgres_nsi:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_nsi:
        condition: service_completed_successfully
    networks:
      - football_network
    command: >
      python -m uvicorn src.backend.nsi_service.main:app --host 0.0.0.0 --port 8001 --workers ${WORKERS:-4}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: football_research_auth_service
    environment:
      DATABASE_URL_AUTH: postgresql+asyncpg://${POSTGRES_USER_AUTH:-postgres}:${POSTGRES_PASSWORD_AUTH:-postgres}@postgres_auth:5432/${POSTGRES_DB_AUTH:-auth_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL: ${JWT_TTL:-3600}
      DEBUG: "false"
    expose:
      - "8002"
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations_auth:
        condition: service_completed_successfully
    networks:
      - football_network
    command: >
      python -m uvicorn src.backend.auth_service.main:app --host 0.0.0.0 --port 8002 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: football_research_api_gateway
    environment:
      SERVICE_NSI_URL: ${SERVICE_NSI_URL:-http://nsi_service:8001}
      SERVICE_AUTH_URL: ${SERVICE_AUTH_URL:-http://auth_service:8002}
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT: ${RATE_LIMIT:-100/minute}
      RATE_LIMIT_BY_JWT: ${RATE_LIMIT_BY_JWT:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      MAX_BODY_SIZE_MB: ${MAX_BODY_SIZE_MB:-10}
      DEBUG: "false"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      nsi_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - football_network
    command: >
      python -m uvicorn src.backend.api_gateway.main:app --host 0.0.0.0 --port 8000 --workers ${GATEWAY_WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_nsi_data:
    driver: local
  postgres_auth_data:
    driver: local
  redis_data:
    driver: local

networks:
  football_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
