[mypy]
python_version = 3.12
explicit_package_bases = True
namespace_packages = True
mypy_path = .
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

disallow_untyped_defs = True
disallow_any_unimported = False
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True

strict_equality = True
extra_checks = True

ignore_missing_imports = False

# Plugins - добавляем pydantic
plugins = sqlalchemy.ext.mypy.plugin,

# Per-module settings
[mypy-src.backend.nsi_service.domain.*]
disallow_any_unimported = True
warn_return_any = True

[mypy-src.backend.nsi_service.application.*]
disallow_any_unimported = True

[mypy-src.backend.nsi_service.infrastructure.*]
disallow_any_unimported = False
warn_return_any = True

[mypy-src.backend.nsi_service.presentation.*]
disallow_any_unimported = False

[mypy-src.backend.nsi_service.processing.*]
disallow_any_unimported = False

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_any_unimported = False
warn_return_any = False

[mypy-tests]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_any_unimported = False
warn_return_any = False

# Third-party library stubs
[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-dishka.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-pydantic_settings.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-adaptix.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-uvicorn]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True
