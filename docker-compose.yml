    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: insider_market_backend_rumor_migrations
    environment:
      DATABASE_URL_RUMOR: postgresql+asyncpg://${POSTGRES_USER_RUMOR:-postgres}:${POSTGRES_PASSWORD_RUMOR:-postgres}@postgres_rumor:5432/${POSTGRES_DB_RUMOR:-rumor_db}
