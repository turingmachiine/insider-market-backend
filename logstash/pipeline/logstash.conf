input {
  redis {
    host => "redis"
    port => 6379
    key => "logs:football"
    data_type => "list"
    codec => plain
  }
}

filter {
  if [message] =~ "^\s*\{" {
    json {
      source => "message"
      remove_field => [ "message" ]
      remove_tag => [ "_jsonparsefailure" ]
    }
  }

  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "insider-market-backend-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
