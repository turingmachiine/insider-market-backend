      SERVICE_AUTH_URL: ${SERVICE_AUTH_URL:-http://auth_service:8002}
      SERVICE_EVENT_URL: ${SERVICE_EVENT_URL:-http://event_service:8004}
      SERVICE_PROFILE_URL: ${SERVICE_PROFILE_URL:-http://profile_service:8007}
      SERVICE_RATING_URL: ${SERVICE_RATING_URL:-http://rating_service:8008}
      SERVICE_MARKET_URL: ${SERVICE_MARKET_URL:-http://market_service:8005}
      SERVICE_RUMOR_URL: ${SERVICE_RUMOR_URL:-http://rumor_service:8003}
      SERVICE_NSI_URL: ${SERVICE_NSI_URL:-http://nsi_service:8001}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      DEBUG: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JSON_LOGS: "true"
      LOG_BROKER_ENABLED: "${LOG_BROKER_ENABLED:-true}"
      LOG_REDIS_URL: redis://redis:6379/0
      LOG_REDIS_KEY: "${LOG_REDIS_KEY:-logs:football}"
    expose:
      - "8009"
    depends_on:
      postgres_admin:
        condition: service_healthy
      migrations_admin:
        condition: service_completed_successfully
      auth_service:
        condition: service_healthy
      nsi_service:
        condition: service_healthy
      rumor_service:
        condition: service_healthy
      event_service:
        condition: service_healthy
      market_service:
        condition: service_healthy
      notification_service:
        condition: service_healthy
      profile_service:
        condition: service_healthy
      rating_service:
        condition: service_healthy
