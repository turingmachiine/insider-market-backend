[project]
name = "football-research"
version = "0.1.0"
description = "Football research application with clean architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "dishka>=1.3.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.12.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "adaptix>=3.0.0b11",
    "httpx>=0.25.0",
    "taskiq>=0.12.2",
    "taskiq-redis>=1.2.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "flake8-bugbear>=23.12.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "testcontainers>=4.0.0",
]

[tool.uv.sources]
football-research = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
strict_equality = true
extra_checks = true

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --asyncio-mode=auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore:`dishka.integrations.starlette` will be removed in `dishka==2.0`:DeprecationWarning:dishka.integrations.fastapi",
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers.redis",
    "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
]

[tool.coverage.run]
source = ["src/backend/nsi_service"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
